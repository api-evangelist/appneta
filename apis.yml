name: AppNeta
description: >-
  AppNeta is a network performance monitoring (NPM) platform for the distributed,
  cloud-connected enterprise, now delivered as a Broadcom product under its
  IT Operations Management / Network Management portfolio. AppNeta Performance
  Manager continuously measures network paths, delivery quality, usage, and
  end-user application experience across SaaS, cloud, and internet paths using a
  combination of active (synthetic) and passive monitoring from distributed
  monitoring points. It exposes a RESTful API (v3 for AppNeta Classic and v4 for
  AppNeta with Intelligent Alarms) for programmatic access to monitoring policies,
  web paths, web applications, alarm connectors, and event/observer integrations,
  authenticated with API access tokens. As of February 2026 the API interface and
  documentation were upgraded from Swagger to OpenAPI 3.0. AppNeta was originally an
  independent, Battery Ventures-backed company before joining Broadcom.
