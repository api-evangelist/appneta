note: >-
  AppNeta publishes no AsyncAPI document. It documents an outbound webhook ("event
  integration") configured through the /v3/observer endpoints of API v3 (AppNeta
  Classic). For the Intelligent Alarms experience AppNeta recommends alarm connectors
  (API v4) instead. The per-event JSON properties are described on the docs' "Event
  data" section and are not reproduced here.
webhooks:
  configure: POST /v3/observer
  configure_note: POST /v3/observer overwrites any existing configuration; include every webhook in the request. Configurations are per user, not per organization.
  token_requirement: API access token with Organization Membership set to Use dynamic membership
  transport: [HTTPS, HTTP]
  tls_note: AppNeta SaaS requires a certificate from a recognized CA; self-signed certificates are not supported. HTTPS recommended.
  receiver_auth: optional custom header name/value sent with each event (e.g. Authorization)
  source_ips: [34.148.110.58, 35.231.244.105, 35.243.220.40, 35.231.104.101, 35.237.114.222, 104.196.65.22, 35.229.35.205, 34.148.182.86, 34.75.230.23, 34.138.221.9]
  ports: [80, 443]
  delivery_note: AppNeta may block-list a receiver that does not respond for an extended period; the docs describe how to check block-list status.
  payload: JSON, a different object per event type
  events:
  - {name: test, flag: testEvents, description: A diagnostic test has completed (or was halted).}
  - {name: sequencer, flag: seqEvents, description: AppNeta lost or reestablished connectivity with a Monitoring Point.}
  - {name: service_quality, flag: sqaEvents, description: A network path alert condition was violated or cleared.}
  - {name: web_application, flag: webAlertEvents, description: A web path alert condition was violated or cleared.}
  - {name: network_change, flag: networkChangeEvents, description: The sequence of networks (BGP Autonomous Systems) on a path changed.}
  unsupported: [Usage events]
